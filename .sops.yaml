keys:
  # Admin: offline emergency age key
  - &recovery "age1ye3hvd0gvus60dc0uu0thy8h5nkw4lvcn53uv2fsp7szksgvfexs6st2qj"
  # Nitrokey 3 FIDO2 (age-plugin-fido2-hmac), same naming as the SSH keys
  - &nk1 "age1fido2-"
  - &nk2 "age1fido2-"
  # Hosts
  - &research "age1wjm0wahfyagjup8pp0trxewj29vz4s6d9ejfs5a7c6dz37fl24ashts8qg"
  - &satalite "age1jddepgp9pucxe0xp9p32geyraztylyw4vrscq48jxh7wv3n7hy5qrtclhd"

creation_rules:
  - path_regex: nixos/hosts/research/(secrets\.sops\.yaml|private\.nix\.sops)$
    key_groups:
      - age:
          - *recovery
          - *nk1
          - *nk2
          - *research
  # research builds and deploys satalite, so it needs the private module
  # (not the runtime secrets).
  - path_regex: nixos/hosts/satalite/private\.nix\.sops$
    key_groups:
      - age:
          - *recovery
          - *nk1
          - *nk2
          - *satalite
          - *research
  - path_regex: nixos/hosts/satalite/secrets\.sops\.yaml$
    key_groups:
      - age:
          - *recovery
          - *nk1
          - *nk2
          - *satalite
