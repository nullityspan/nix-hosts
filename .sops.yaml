keys:
  # Admin: offline emergency age key
  - &recovery "age1ye3hvd0gvus60dc0uu0thy8h5nkw4lvcn53uv2fsp7szksgvfexs6st2qj"
  # Nitrokey 3 FIDO2 (age-plugin-fido2-hmac), same naming as the SSH keys
  - &nk1 "age1fido2-"
  - &nk2 "age1fido2-"
  # Hosts
  - &workstation "age1ust3kmy05n4z4x7f5etmctvpmv9gdy7y0mgvnyv6y9fuhm2lu5ysrasleg"
  - &research "age1wjm0wahfyagjup8pp0trxewj29vz4s6d9ejfs5a7c6dz37fl24ashts8qg"

creation_rules:
  - path_regex: secrets/common\.sops\.yaml$
    key_groups:
      - age:
          - *recovery
          - *nk1
          - *nk2
          - *workstation
          - *research
          # - *homeserver
          # - *work

  - path_regex: nixos/hosts/workstation/(secrets\.sops\.yaml|private\.nix\.sops)$
    key_groups:
      - age:
          - *recovery
          - *nk1
          - *nk2
          - *workstation

  - path_regex: nixos/hosts/research/(secrets\.sops\.yaml|private\.nix\.sops)$
    key_groups:
      - age:
          - *recovery
          - *nk1
          - *nk2
          - *research
